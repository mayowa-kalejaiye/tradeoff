<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid Black Background -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Brutalist Red "T" -->
  <rect x="128" y="144" width="256" height="64" fill="#ff291a" />
  <rect x="224" y="144" width="64" height="224" fill="#ff291a" />
  
  <!-- Technical Blueprint / Registration Marks (Top Left) -->
  <line x1="64" y1="64" x2="96" y2="64" stroke="#ffffff" stroke-width="8" />
  <line x1="64" y1="64" x2="64" y2="96" stroke="#ffffff" stroke-width="8" />
  
  <!-- Top Right -->
  <line x1="448" y1="64" x2="416" y2="64" stroke="#ffffff" stroke-width="8" />
  <line x1="448" y1="64" x2="448" y2="96" stroke="#ffffff" stroke-width="8" />
  
  <!-- Bottom Left -->
  <line x1="64" y1="448" x2="96" y2="448" stroke="#ffffff" stroke-width="8" />
  <line x1="64" y1="448" x2="64" y2="416" stroke="#ffffff" stroke-width="8" />
  
  <!-- Bottom Right -->
  <line x1="448" y1="448" x2="416" y2="448" stroke="#ffffff" stroke-width="8" />
  <line x1="448" y1="448" x2="448" y2="416" stroke="#ffffff" stroke-width="8" />

  <!-- Technical Grid overlay on the T -->
  <line x1="128" y1="176" x2="384" y2="176" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="256" y1="144" x2="256" y2="368" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" />
</svg>
